<article class="item-card">
    <div class="item-imagem">
        <img src="{{ item.imagem.url }}" alt="{{ item.nome }}">
    </div>

    <div class="item-info">
        <p class="item-descricao">
            {{ item.nome }}
        </p>

        <p class="item-preco">
            {{ item.preco }}
        </p>
    </div>
</article>
